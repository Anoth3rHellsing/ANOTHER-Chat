openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: A.N.O.T.H.E.R. Private API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: servers
    description: Server management
  - name: channels
    description: Channel management
  - name: messages
    description: Message management
  - name: events
    description: Channel calendar events and RSVPs
  - name: users
    description: User profiles
  - name: admin
    description: Admin management
  - name: roles
    description: Server role management
  - name: invites
    description: Server invitation management
  - name: attachments
    description: File attachments
  - name: channelFiles
    description: Private files stored in media channels
  - name: reactions
    description: Message emoji reactions
  - name: dms
    description: Direct messages between users
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid data or invite code

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List servers the current user is a member of
      responses:
        "200":
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
    post:
      operationId: createServer
      tags: [servers]
      summary: Create a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerInput"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server details
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "404":
          description: Server not found
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server (owner only)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Server deleted
        "403":
          description: Forbidden

  /servers/{serverId}/join:
    post:
      operationId: joinServer
      tags: [servers]
      summary: Join a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/leave:
    post:
      operationId: leaveServer
      tags: [servers]
      summary: Leave a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left server

  /servers/join-by-invite:
    post:
      operationId: joinServerByInvite
      tags: [invites]
      summary: Join a server using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinByInviteInput"
      responses:
        "200":
          description: Joined server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          description: Invalid or expired invite
        "404":
          description: Invite not found

  /servers/{serverId}/invites:
    get:
      operationId: listServerInvites
      tags: [invites]
      summary: List active invite codes for a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerInvite"
    post:
      operationId: createServerInvite
      tags: [invites]
      summary: Create a server invite code
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInvite"

  /servers/{serverId}/invites/{code}:
    delete:
      operationId: revokeServerInvite
      tags: [invites]
      summary: Revoke a server invite code
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked

  /servers/{serverId}/icon:
    post:
      operationId: uploadServerIcon
      tags: [servers]
      summary: Upload server icon image
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Icon uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResult"

  /servers/{serverId}/banner:
    post:
      operationId: uploadServerBanner
      tags: [servers]
      summary: Upload server banner image
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Banner uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResult"

  /servers/{serverId}/members:
    get:
      operationId: getServerMembers
      tags: [servers]
      summary: Get all members of a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/members/{userId}/role:
    patch:
      operationId: updateMemberRole
      tags: [servers]
      summary: Update a member's server role (owner/admin/member)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/roles:
    get:
      operationId: listServerRoles
      tags: [roles]
      summary: List custom roles for a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerRole"
    post:
      operationId: createServerRole
      tags: [roles]
      summary: Create a custom role in a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerRoleInput"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRole"

  /servers/{serverId}/roles/{roleId}:
    patch:
      operationId: updateServerRole
      tags: [roles]
      summary: Update a custom role
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerRoleInput"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRole"
    delete:
      operationId: deleteServerRole
      tags: [roles]
      summary: Delete a custom role
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role deleted

  /servers/{serverId}/members/{userId}/roles/{roleId}:
    post:
      operationId: assignMemberRole
      tags: [roles]
      summary: Assign a custom role to a member
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role assigned
    delete:
      operationId: removeMemberRole
      tags: [roles]
      summary: Remove a custom role from a member
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role removed

  /servers/{serverId}/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List channels in a server (filtered by caller's roles)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel in a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{channelId}:
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel name or role restrictions
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Channel deleted

  /channels/{channelId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a channel (paginated)
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: Cursor — return messages before this message ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max messages to return (default 50)
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /channels/{channelId}/events:
    get:
      operationId: listChannelEvents
      tags: [events]
      summary: List events in a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelEvent"
        "401":
          description: Authentication is required
        "403":
          description: The caller cannot access this channel
        "404":
          description: The channel does not exist
    post:
      operationId: createChannelEvent
      tags: [events]
      summary: Create an event in a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "400":
          description: Event input is invalid
        "401":
          description: Authentication is required
        "403":
          description: The caller cannot create events in this channel
        "404":
          description: The channel does not exist

  /channels/{channelId}/events/{eventId}:
    get:
      operationId: getChannelEvent
      tags: [events]
      summary: Get a channel event
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "401":
          description: Authentication is required
        "403":
          description: The caller cannot access this channel
        "404":
          description: The channel or event does not exist
    patch:
      operationId: updateChannelEvent
      tags: [events]
      summary: Edit a channel event
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "400":
          description: Event update is invalid
        "401":
          description: Authentication is required
        "403":
          description: The caller is not allowed to edit this event
        "404":
          description: The channel or event does not exist
    delete:
      operationId: cancelChannelEvent
      tags: [events]
      summary: Soft-cancel a channel event
      description: Marks the event as canceled and returns the updated event; the event is not permanently deleted.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "401":
          description: Authentication is required
        "403":
          description: The caller is not allowed to cancel this event
        "404":
          description: The channel or event does not exist

  /channels/{channelId}/events/{eventId}/response:
    put:
      operationId: respondToChannelEvent
      tags: [events]
      summary: Create or update the caller's RSVP to an event
      description: Each person has one response per event; this operation replaces that person's existing response if present.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPInput"
      responses:
        "200":
          description: Event response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "400":
          description: RSVP status is invalid
        "401":
          description: Authentication is required
        "403":
          description: The caller cannot respond to this event
        "404":
          description: The channel or event does not exist

  /events/upcoming/mine:
    get:
      operationId: listMyUpcomingEvents
      tags: [events]
      summary: List upcoming events the caller is attending or considering
      description: Returns upcoming events where the caller's RSVP is yes or maybe. This is a normal request-response endpoint and does not poll or stream updates.
      responses:
        "200":
          description: Upcoming events with the caller's yes or maybe RSVP
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelEvent"
        "401":
          description: Authentication is required

  /channels/{channelId}/attachments:
    post:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload a file attachment for a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /channels/{channelId}/files:
    get:
      operationId: listChannelFiles
      tags: [channelFiles]
      summary: List files in an accessible media channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Files, upload limit, and VirusTotal availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileList"
        "403": { description: Channel access denied or channel is not media }
        "404": { description: Channel not found }
  /channels/{channelId}/files/uploads:
    post:
      operationId: createChannelFileUpload
      tags: [channelFiles]
      summary: Create a resumable upload session
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelFileUploadInput"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileUploadSession"
        "413": { description: Declared size exceeds configured maximum }

  /channels/{channelId}/files/uploads/{uploadId}/chunks:
    post:
      operationId: uploadChannelFileChunk
      tags: [channelFiles]
      summary: Upload one 4 MiB chunk at its declared byte offset
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
        - name: offset
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk]
              properties:
                chunk: { type: string, format: binary }
      responses:
        "200":
          description: Chunk accepted (including an identical retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileUploadProgress"
        "409": { description: Offset does not match session state }
        "413": { description: Chunk exceeds 4 MiB or remaining file limit }

  /channels/{channelId}/files/uploads/{uploadId}/finish:
    post:
      operationId: finishChannelFileUpload
      tags: [channelFiles]
      summary: Validate and finalize a complete upload
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: The same file returned by a previous successful finish retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFile"
        "201":
          description: File stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFile"
        "409": { description: Upload is incomplete or has expired }
        "415": { description: File signature or type is not allowed }
        "413": { description: File exceeds configured maximum }

  /channels/{channelId}/files/uploads/{uploadId}:
    get:
      operationId: getChannelFileUploadStatus
      tags: [channelFiles]
      summary: Get authoritative resumable upload progress
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: Current upload offset and optional finalized file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileUploadStatus"
        "404": { description: Upload session not found or expired }
    delete:
      operationId: abortChannelFileUpload
      tags: [channelFiles]
      summary: Abort and remove a resumable upload
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "204": { description: Upload session removed }
        "404": { description: Upload session not found }

  /channels/{channelId}/files/{fileId}/download:
    get:
      operationId: downloadChannelFile
      tags: [channelFiles]
      summary: Download a private channel file
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: File bytes with hardened attachment headers }
        "403": { description: Channel access denied }
        "404": { description: File not found }

  /channels/{channelId}/files/{fileId}:
    delete:
      operationId: deleteChannelFile
      tags: [channelFiles]
      summary: Delete a file as its uploader or a server administrator
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: File and bytes deleted }
        "403": { description: Caller is not permitted to delete the file }
        "404": { description: File not found }

  /channels/{channelId}/files/{fileId}/verify:
    post:
      operationId: verifyChannelFile
      tags: [channelFiles]
      summary: Explicitly submit a file to VirusTotal after user consent
      description: Requires {consent:true}. No automatic external submissions occur. VirusTotal public API use is noncommercial and rate limited. Files outside scan scope return 422; files larger than 650 MiB return 413 before hash-cache lookups or provider requests.
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelFileVerifyInput"
      responses:
        "202":
          description: Scan queued or in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileScan"
        "200":
          description: Existing completed same-hash scan reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileScan"
        "400": { description: Explicit consent is required }
        "413": { description: File exceeds VirusTotal's 650 MiB maximum scan size }
        "422": { description: File is out of scope for VirusTotal scanning }
        "429": { description: VirusTotal request quota exhausted }
        "503": { description: VirusTotal is not configured }

  /channels/{channelId}/files/{fileId}/scan:
    get:
      operationId: getChannelFileScan
      tags: [channelFiles]
      summary: Get current VirusTotal scan state
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current or never-started scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelFileScan"
        "404": { description: File not found }

  /messages/{messageId}/reactions:
    post:
      operationId: toggleReaction
      tags: [reactions]
      summary: Toggle a single Unicode emoji reaction on a channel message
      description: Requires channel read access. Accepts exactly one emoji sequence (including common modifiers, ZWJ sequences, flags, and keycaps); at most 20 distinct emoji reactions may exist per message. Returns full grouped state. Broadcasts message_reaction_update with data { channelId, messageId, reactions } to channel subscribers.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reactions updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"

  /messages/{messageId}/reactions/{emoji}:
    delete:
      operationId: deleteReaction
      tags: [reactions]
      summary: Remove an emoji reaction from a channel message
      description: Requires channel read access. The decoded emoji path parameter must be exactly one valid Unicode emoji sequence. Returns full grouped state and broadcasts message_reaction_update with data { channelId, messageId, reactions } to channel subscribers.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reactions updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"

  /dms/messages/{dmId}/reactions:
    post:
      operationId: toggleDmReaction
      tags: [reactions, dms]
      summary: Toggle an emoji reaction on a direct message
      description: Only the sender and recipient may react. Accepts exactly one valid Unicode emoji sequence and at most 20 distinct emojis may exist per message. Returns full grouped state and broadcasts dm_reaction_update with data { messageId, reactions } to every WebSocket connection of both participants.
      parameters:
        - name: dmId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Full grouped DM reaction state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"
        "400":
          description: Invalid emoji or per-message distinct-emoji limit reached
        "403":
          description: Caller is not a message participant
        "404":
          description: Message not found

  /dms/messages/{dmId}/reactions/{emoji}:
    delete:
      operationId: deleteDmReaction
      tags: [reactions, dms]
      summary: Remove the caller's emoji reaction from a direct message
      description: Only the sender and recipient may remove reactions. The decoded emoji must be exactly one valid Unicode emoji sequence. Returns full grouped state and broadcasts dm_reaction_update with data { messageId, reactions } to every WebSocket connection of both participants.
      parameters:
        - name: dmId
          in: path
          required: true
          schema:
            type: integer
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full grouped DM reaction state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"
        "400":
          description: Invalid emoji
        "403":
          description: Caller is not a message participant
        "404":
          description: Message not found

  /dm-groups/{groupId}/messages:
    get:
      operationId: getDmGroupMessages
      tags: [dms]
      summary: Get the latest group DM messages with their grouped reactions
      description: Requires current membership in the group. Returns up to 50 non-deleted messages, oldest first, with grouped reactions on each message.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: Return messages with IDs older than this cursor.
      responses:
        "200":
          description: Group messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMessage"
        "403":
          description: Caller is not a current group member
    post:
      operationId: sendDmGroupMessage
      tags: [dms]
      summary: Send a message to a DM group
      description: Requires current membership. Newly sent messages have an empty reactions array.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMessageInput"
      responses:
        "201":
          description: Group message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMessage"
        "403":
          description: Caller is not a current group member

  /dm-groups/{groupId}/messages/{messageId}/reactions:
    post:
      operationId: toggleDmGroupReaction
      tags: [reactions, dms]
      summary: Toggle the caller's emoji reaction on a group DM message
      description: Requires current group membership; the message must belong to the path group and not be deleted. Accepts exactly one bounded Unicode emoji sequence using the shared emoji validator. At most 20 distinct emojis may exist per message. Returns full grouped state and broadcasts dm_group:reaction_update with data { groupId, messageId, reactions } to every current group member's WebSocket connections using user-targeted delivery.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Full grouped reaction state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"
        "400":
          description: Invalid emoji or per-message distinct-emoji limit reached
        "403":
          description: Caller is not a current group member
        "404":
          description: Message not found in this group or deleted

  /dm-groups/{groupId}/messages/{messageId}/reactions/{emoji}:
    delete:
      operationId: deleteDmGroupReaction
      tags: [reactions, dms]
      summary: Remove the caller's emoji reaction from a group DM message
      description: Requires current group membership; the message must belong to the path group and not be deleted. The decoded path emoji must be exactly one bounded Unicode emoji sequence using the shared emoji validator. Returns full grouped state and broadcasts dm_group:reaction_update with data { groupId, messageId, reactions } to every current group member's WebSocket connections using user-targeted delivery.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
        - name: emoji
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Full grouped reaction state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"
        "400":
          description: Invalid emoji
        "403":
          description: Caller is not a current group member
        "404":
          description: Message not found in this group or deleted

  /channels/{channelId}/messages/{messageId}:
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Message deleted

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found

  /users/me:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/invites:
    get:
      operationId: listInvites
      tags: [admin]
      summary: List all invite codes
      responses:
        "200":
          description: Invite codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCode"
    post:
      operationId: generateInvite
      tags: [admin]
      summary: Generate a new invite code
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCode"

  /admin/invites/{code}:
    delete:
      operationId: revokeInvite
      tags: [admin]
      summary: Revoke an invite code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked

  /admin/users:
    get:
      operationId: listAllUsers
      tags: [admin]
      summary: List all registered users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/kick:
    post:
      operationId: kickUser
      tags: [admin]
      summary: Kick a user from all servers
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User kicked

  /admin/users/{userId}/ban:
    post:
      operationId: banUser
      tags: [admin]
      summary: Ban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User banned

  /admin/users/{userId}/unban:
    post:
      operationId: unbanUser
      tags: [admin]
      summary: Unban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User unbanned

  /channels/{channelId}/voice:
    get:
      operationId: getVoiceMembers
      tags: [channels]
      summary: Get current voice channel members
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voice members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceMember"

  /channels/{channelId}/voice/join:
    post:
      operationId: joinVoiceChannel
      tags: [channels]
      summary: Join a voice channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voice members after joining
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceMember"

  /channels/{channelId}/voice/leave:
    post:
      operationId: leaveVoiceChannel
      tags: [channels]
      summary: Leave a voice channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left voice channel

  /dms:
    get:
      operationId: listDmConversations
      tags: [dms]
      summary: List all DM conversations for the current user (ordered by most recent activity)
      responses:
        "200":
          description: DM conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmConversation"

  /dms/{userId}:
    get:
      operationId: getDmHistory
      tags: [dms]
      summary: Get DM message history with a user (most recent 50)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: DM messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
    post:
      operationId: sendDm
      tags: [dms]
      summary: Send a direct message to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmInput"
      responses:
        "201":
          description: DM sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"

  /dms/{userId}/read:
    post:
      operationId: markDmRead
      tags: [dms]
      summary: Mark DM conversation as read (updates cursor to now)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked as read

  /dms/messages/{dmId}:
    delete:
      operationId: deleteDm
      tags: [dms]
      summary: Soft-delete own DM message
      parameters:
        - name: dmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform activity stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    VoiceMember:
      type: object
      required: [userId, username, displayName, status]
      properties:
        userId:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SocialLink:
      type: object
      required: [platform, url]
      properties:
        platform:
          type: string
          enum: [instagram, twitter, youtube, twitch, github, custom]
        url:
          type: string
        label:
          type: string

    User:
      type: object
      required: [id, username, displayName, status, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, away, dnd, offline]
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
        socialLinks:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"

    UserProfile:
      type: object
      required: [id, username, displayName, status, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, away, dnd, offline]
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
        socialLinks:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"

    AdminUser:
      type: object
      required: [id, username, displayName, status, role, banned, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        status:
          type: string
        role:
          type: string
        banned:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    Server:
      type: object
      required: [id, name, ownerId, memberCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        iconUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        isGeneral:
          type: boolean
        ownerId:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ServerRole:
      type: object
      required: [id, serverId, name, color, permissions, position, createdAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        name:
          type: string
        color:
          type: string
        permissions:
          type: integer
          description: "Bitmask: 1=manage_channels, 2=kick_members, 4=ban_members, 8=manage_messages"
        position:
          type: integer
        createdAt:
          type: string
          format: date-time

    ServerMember:
      type: object
      required: [id, serverId, userId, role, roles, joinedAt, user]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        userId:
          type: integer
        role:
          type: string
          enum: [owner, admin, member]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ServerRole"
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserProfile"

    Channel:
      type: object
      required: [id, serverId, name, channelType, restrictedRoles, visualConfig, createdAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        name:
          type: string
        channelType:
          type: string
          enum: [text, voice, media, calendar]
        restrictedRoles:
          type: array
          items:
            type: integer
          description: Role IDs that can access this channel. Empty = unrestricted.
        visualConfig:
          type: object
          description: "Visual decoration: { kind: 'gradient'|'image', value: string }"
        createdAt:
          type: string
          format: date-time

    ChannelEvent:
      type: object
      required: [id, channelId, creatorId, creator, title, description, startsAt, endsAt, originalTimeZone, canceledAt, createdAt, updatedAt, responses, counts, myResponse]
      properties:
        id:
          type: integer
        channelId:
          type: integer
        creatorId:
          type: integer
        creator:
          type: object
          required: [id, username, displayName, avatarUrl]
          properties:
            id:
              type: integer
            username:
              type: string
            displayName:
              type: string
            avatarUrl:
              type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        startsAt:
          type: string
          format: date-time
          description: UTC ISO 8601 date-time.
        endsAt:
          type: ["string", "null"]
          format: date-time
          description: Optional event end time as a date-time.
        originalTimeZone:
          type: string
          description: IANA time zone identifier used when the event was created.
        canceledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        responses:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        counts:
          type: object
          required: [yes, no, maybe]
          properties:
            yes:
              type: integer
            no:
              type: integer
            maybe:
              type: integer
        myResponse:
          anyOf:
            - $ref: "#/components/schemas/EventResponse"
            - type: "null"

    EventResponse:
      type: object
      required: [userId, status, user, updatedAt]
      properties:
        userId:
          type: integer
        status:
          type: string
          enum: [yes, no, maybe]
        user:
          type: object
          required: [name, displayName, avatarUrl]
          properties:
            name:
              type: string
            displayName:
              type: string
            avatarUrl:
              type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    ServerInvite:
      type: object
      required: [id, serverId, code, createdById, revoked, createdAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        code:
          type: string
        createdById:
          type: integer
        usedById:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        revoked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    JoinByInviteInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    Attachment:
      type: object
      required: [id, url, filename, mimeType, size]
      properties:
        id:
          type: integer
        url:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer

    ChannelFileUploadInput:
      type: object
      required: [filename, sizeBytes]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1 }

    ChannelFileUploadSession:
      type: object
      required: [uploadId, chunkSize, maxBytes, offset, expiresAt]
      properties:
        uploadId: { type: string, minLength: 36, maxLength: 36 }
        chunkSize: { type: integer }
        maxBytes: { type: integer }
        offset: { type: integer }
        expiresAt: { type: string, format: date-time }

    ChannelFileUploadProgress:
      type: object
      required: [uploadId, offset, complete]
      properties:
        uploadId: { type: string, minLength: 36, maxLength: 36 }
        offset: { type: integer }
        complete: { type: boolean }

    ChannelFileUploadStatus:
      type: object
      required: [uploadId, offset, expectedBytes, chunkSize]
      properties:
        uploadId: { type: string, minLength: 36, maxLength: 36 }
        offset: { type: integer }
        expectedBytes: { type: integer }
        chunkSize: { type: integer }
        completedFileId: { type: ["integer", "null"] }

    ChannelFile:
      type: object
      required: [id, channelId, filename, mimeType, sizeBytes, sha256, uploadedBy, createdAt, downloadPath, scanEligibility]
      properties:
        id: { type: integer }
        channelId: { type: integer }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        uploadedBy: { type: integer }
        uploaderName: { type: string }
        createdAt: { type: string, format: date-time }
        downloadPath: { type: string, description: Authenticated API path, not a public static URL }
        scanEligibility:
          $ref: "#/components/schemas/ChannelFileScanEligibility"
        scan:
          $ref: "#/components/schemas/ChannelFileScan"

    ChannelFileScanEligibility:
      type: object
      required: [eligible, reason, extensionMismatch, detectedMimeType, maxBytes]
      properties:
        eligible: { type: boolean, description: Whether this file may be submitted to VirusTotal }
        reason:
          type: ["string", "null"]
          enum: [out_of_scope, too_large, null]
        extensionMismatch: { type: boolean, description: Recognized filename extension does not match the server-detected content type }
        detectedMimeType: { type: string }
        maxBytes: { type: integer, description: VirusTotal maximum file size (650 MiB) }

    ChannelFileList:
      type: object
      required: [files, maxBytes, scannerAvailable]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/ChannelFile" }
        maxBytes: { type: integer }
        scannerAvailable: { type: boolean }

    ChannelFileVerifyInput:
      type: object
      required: [consent]
      properties:
        consent:
          type: boolean
          const: true

    ChannelFileScan:
      type: object
      required: [status, sha256, harmless, undetected, suspicious, malicious, source, submittedBy, submittedAt]
      properties:
        status:
          type: string
          enum: [unavailable, not_started, queued, in_progress, completed, error]
        sha256: { type: string }
        harmless: { type: ["integer", "null"] }
        undetected: { type: ["integer", "null"] }
        suspicious: { type: ["integer", "null"] }
        malicious: { type: ["integer", "null"] }
        source:
          type: ["string", "null"]
          enum: [local, hash, upload, null]
        submittedBy: { type: ["integer", "null"] }
        submittedByName: { type: ["string", "null"], description: Display name of the member who requested this file's scan; available in channel file listings }
        submittedAt: { type: ["string", "null"], format: date-time }
        error: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"], format: date-time }

