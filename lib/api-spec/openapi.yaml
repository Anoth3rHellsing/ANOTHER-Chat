openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: A.N.O.T.H.E.R. Private API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: servers
    description: Server management
  - name: channels
    description: Channel management
  - name: messages
    description: Message management
  - name: users
    description: User profiles
  - name: admin
    description: Admin management
  - name: roles
    description: Server role management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid data or invite code

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List servers the current user is a member of
      responses:
        "200":
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
    post:
      operationId: createServer
      tags: [servers]
      summary: Create a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerInput"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server details
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "404":
          description: Server not found
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server (owner only)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Server deleted
        "403":
          description: Forbidden

  /servers/{serverId}/join:
    post:
      operationId: joinServer
      tags: [servers]
      summary: Join a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/leave:
    post:
      operationId: leaveServer
      tags: [servers]
      summary: Leave a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left server

  /servers/{serverId}/members:
    get:
      operationId: getServerMembers
      tags: [servers]
      summary: Get all members of a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/members/{userId}/role:
    patch:
      operationId: updateMemberRole
      tags: [servers]
      summary: Update a member's server role (owner/admin/member)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMember"

  /servers/{serverId}/roles:
    get:
      operationId: listServerRoles
      tags: [roles]
      summary: List custom roles for a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerRole"
    post:
      operationId: createServerRole
      tags: [roles]
      summary: Create a custom role in a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerRoleInput"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRole"

  /servers/{serverId}/roles/{roleId}:
    patch:
      operationId: updateServerRole
      tags: [roles]
      summary: Update a custom role
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerRoleInput"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRole"
    delete:
      operationId: deleteServerRole
      tags: [roles]
      summary: Delete a custom role
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role deleted

  /servers/{serverId}/members/{userId}/roles/{roleId}:
    post:
      operationId: assignMemberRole
      tags: [roles]
      summary: Assign a custom role to a member
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role assigned
    delete:
      operationId: removeMemberRole
      tags: [roles]
      summary: Remove a custom role from a member
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role removed

  /servers/{serverId}/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List channels in a server (filtered by caller's roles)
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel in a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{channelId}:
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel name or role restrictions
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Channel deleted

  /channels/{channelId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a channel (paginated)
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: Cursor — return messages before this message ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max messages to return (default 50)
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to a channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /channels/{channelId}/messages/{messageId}:
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Message deleted

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found

  /users/me:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/invites:
    get:
      operationId: listInvites
      tags: [admin]
      summary: List all invite codes
      responses:
        "200":
          description: Invite codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCode"
    post:
      operationId: generateInvite
      tags: [admin]
      summary: Generate a new invite code
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCode"

  /admin/invites/{code}:
    delete:
      operationId: revokeInvite
      tags: [admin]
      summary: Revoke an invite code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked

  /admin/users:
    get:
      operationId: listAllUsers
      tags: [admin]
      summary: List all registered users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/kick:
    post:
      operationId: kickUser
      tags: [admin]
      summary: Kick a user from all servers
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User kicked

  /admin/users/{userId}/ban:
    post:
      operationId: banUser
      tags: [admin]
      summary: Ban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User banned

  /admin/users/{userId}/unban:
    post:
      operationId: unbanUser
      tags: [admin]
      summary: Unban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User unbanned

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform activity stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SocialLink:
      type: object
      required: [platform, url]
      properties:
        platform:
          type: string
          enum: [instagram, twitter, youtube, twitch, github, custom]
        url:
          type: string
        label:
          type: string

    User:
      type: object
      required: [id, username, displayName, status, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, away, dnd, offline]
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
        socialLinks:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"

    UserProfile:
      type: object
      required: [id, username, displayName, status, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, away, dnd, offline]
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
        socialLinks:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"

    AdminUser:
      type: object
      required: [id, username, displayName, status, role, banned, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        status:
          type: string
        role:
          type: string
        banned:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    Server:
      type: object
      required: [id, name, ownerId, memberCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        iconUrl:
          type: ["string", "null"]
        ownerId:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ServerRole:
      type: object
      required: [id, serverId, name, color, permissions, position, createdAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        name:
          type: string
        color:
          type: string
        permissions:
          type: integer
          description: "Bitmask: 1=manage_channels, 2=kick_members, 4=ban_members, 8=manage_messages"
        position:
          type: integer
        createdAt:
          type: string
          format: date-time

    ServerMember:
      type: object
      required: [id, serverId, userId, role, roles, joinedAt, user]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        userId:
          type: integer
        role:
          type: string
          enum: [owner, admin, member]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ServerRole"
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserProfile"

    Channel:
      type: object
      required: [id, serverId, name, restrictedRoles, createdAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        name:
          type: string
        restrictedRoles:
          type: array
          items:
            type: integer
          description: Role IDs that can access this channel. Empty = unrestricted.
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, channelId, userId, content, createdAt, author]
      properties:
        id:
          type: integer
        channelId:
          type: integer
        userId:
          type: integer
        content:
          type: string
        editedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/UserProfile"

    InviteCode:
      type: object
      required: [code, generatedById, revoked, createdAt]
      properties:
        code:
          type: string
        generatedById:
          type: integer
        usedById:
          type: ["integer", "null"]
        revoked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        usedAt:
          type: ["string", "null"]
          format: date-time

    AdminStats:
      type: object
      required: [userCount, messageCount, serverCount, activeUserCount]
      properties:
        userCount:
          type: integer
        messageCount:
          type: integer
        serverCount:
          type: integer
        activeUserCount:
          type: integer

    AvatarUploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [username, password, displayName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        inviteCode:
          type: string

    ServerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ServerRoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
        permissions:
          type: integer

    ChannelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        restrictedRoles:
          type: array
          items:
            type: integer

    ChannelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        restrictedRoles:
          type: array
          items:
            type: integer

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    MessageUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [online, away, dnd, offline]
        socialLinks:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"

    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]

    InviteInput:
      type: object
      properties:
        note:
          type: string
